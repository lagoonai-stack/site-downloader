<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar - Site Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .card {
      background: #1e293b; padding: 32px; border-radius: 16px;
      width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p.sub { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
    input {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155;
      background: #0f172a; color: #e2e8f0; font-size: 15px; margin-bottom: 14px;
    }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #6366f1; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #4f46e5; }
    .status { margin-top: 16px; font-size: 14px; min-height: 20px; color: #94a3b8; }
    .hidden { display: none; }
    .link {
      background: none; color: #818cf8; padding: 0; margin-top: 4px;
      font-size: 13px; text-align: left; width: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Site Downloader</h1>
    <p class="sub" id="subtitle">Acesso exclusivo para assinantes. Informe seu e-mail para receber um codigo de acesso.</p>

    <div id="stepEmail">
      <input id="email" type="email" placeholder="seu@email.com" autocomplete="email" />
      <button id="btnRequest">Enviar codigo</button>
    </div>

    <div id="stepCode" class="hidden">
      <input id="code" type="text" inputmode="numeric" placeholder="Codigo recebido por e-mail" autocomplete="one-time-code" />
      <button id="btnVerify">Confirmar codigo</button>
      <button id="btnBack" class="link">Usar outro e-mail</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
