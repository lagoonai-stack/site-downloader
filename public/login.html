<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar - Site Downloader</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <h1>Site Downloader</h1>
      </div>
    </div>

    <p class="sub" id="subtitle">Acesso exclusivo para assinantes. Informe seu e-mail para receber um codigo de acesso.</p>

    <div id="stepEmail">
      <div class="field">
        <input id="email" type="email" placeholder="seu@email.com" autocomplete="email" />
      </div>
      <button id="btnRequest">Enviar codigo</button>
    </div>

    <div id="stepCode" class="hidden">
      <div class="field">
        <input id="code" type="text" inputmode="numeric" placeholder="Codigo recebido por e-mail" autocomplete="one-time-code" />
      </div>
      <button id="btnVerify">Confirmar codigo</button>
      <button id="btnBack" class="link-btn">Usar outro e-mail</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
