<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates · Site Downloader</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .search-bar {
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px 28px 4px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .search-bar input {
      flex: 1;
      max-width: 480px;
    }
    .search-bar .count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      border-radius: 999px;
      padding: 7px 14px;
      white-space: nowrap;
    }
    .filters {
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 28px 4px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill {
      width: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .pill:hover { color: var(--text); }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 28px 80px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px 20px;
    }
    @media (max-width: 1300px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 920px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .gcard { background: transparent; }
    .thumb-wrap {
      position: relative;
      display: block;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      aspect-ratio: 16/10;
      transition: transform .18s ease, border-color .18s ease;
    }
    .thumb-wrap:hover { transform: translateY(-3px); border-color: #475569; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 2px 0; }
    .meta-left { min-width: 0; }
    .title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 3px 9px;
    }
    .actions { flex-shrink: 0; }
    .action-btn {
      width: auto;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .action-btn.preview-btn {
      display: inline-block;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
    }
    .action-btn.preview-btn:hover { border-color: #475569; }
    .empty { grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 80px 20px; font-size: 15px; }
    .gallery-status {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 28px 20px;
      font-size: 13px;
      color: var(--text-muted);
      min-height: 18px;
    }
  </style>
</head>
<body class="full-page">
  <header class="toolbar">
    <div class="brand-mark">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <h1>Site Downloader</h1>
    </div>
    <nav>
      <a href="/" class="active">Templates</a>
      <a href="/downloader.html">Baixar site personalizado</a>
    </nav>
    <button class="logout-btn" id="btnLogout">Sair</button>
  </header>

  <div class="search-bar">
    <input id="q" type="text" placeholder="Buscar designs..." autocomplete="off" />
    <span class="count" id="count"></span>
  </div>

  <nav class="filters" id="filters">
    <button class="pill active" data-cat="todos">Todos</button>
    <button class="pill" data-cat="escuro">Temas Escuros</button>
    <button class="pill" data-cat="claro">Temas Claros</button>
    <button class="pill" data-cat="componente">Componentes</button>
  </nav>

  <main class="grid" id="grid"></main>
  <div class="gallery-status" id="status"></div>

  <script src="/gallery.js"></script>
</body>
</html>
